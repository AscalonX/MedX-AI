<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:S;src:url(SCBXBeta2-Regular.otf);font-weight:400}
@font-face{font-family:S;src:url(SCBXBeta2-Bold.otf);font-weight:700}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1180px;background:#EEF3F6;font-family:S,sans-serif;color:#0F1E2E;padding:40px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:32px}
.c{background:#fff;border-radius:28px;box-shadow:0 8px 30px rgba(15,30,46,.12);border:1px solid #E3E9EF;overflow:hidden;display:flex;flex-direction:column}
.h{padding:20px 28px 12px;display:flex;gap:14px;align-items:center}
.n{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#0A8077,#1A5FC4);color:#fff;font-weight:700;font-size:24px;display:grid;place-items:center}
.t{font-size:28px;font-weight:700}.s{font-size:19px;color:#45566A}
.i{flex:1;margin:0 20px 20px;border-radius:16px;overflow:hidden;background:#EEF3F6;position:relative}
.i img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.ph{background:linear-gradient(135deg,#0A8077,#1A5FC4)}
.ph img{width:auto;height:92%;position:absolute;left:50%;top:4%;transform:translateX(-50%);border-radius:30px;border:6px solid #fff}
</style></head><body>
<div class="c"><div class="h"><div class="n">1</div><div><div class="t">Patient</div><div class="s">Speaks or types; sees when a nurse has read it</div></div></div><div class="i ph"><img src="s-patient.jpg"></div></div>
<div class="c"><div class="h"><div class="n">2</div><div><div class="t">Nurse</div><div class="s">Consult assistant: ask-next popups, source quotes</div></div></div><div class="i"><img src="s-nurse.png"></div></div>
<div class="c"><div class="h"><div class="n">3</div><div><div class="t">Doctor</div><div class="s">Orders with an allergy alert and a written override</div></div></div><div class="i"><img src="s-doctor.png"></div></div>
<div class="c"><div class="h"><div class="n">4</div><div><div class="t">Pharmacist</div><div class="s">Verify or return, with the doctor's reason in view</div></div></div><div class="i"><img src="s-pharmacist.png"></div></div>
</body></html>
