# Render Blueprint: single Docker web service (one instance keeps the demo store consistent).
services:
  - type: web
    name: medx-bridge
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: MODEL_PROVIDER
        value: mock
      - key: DEMO_SEED
        value: "1"
      - key: DEMO_AUTOSEED
        value: "1"
      - key: DEMO_TOKEN
        generateValue: true
      # File store on ephemeral disk (/api/health reports store "tmp-ephemeral"). To share state with Vercel
      # instead, add DATABASE_URL (Neon) here; MEDX_STORE_NS keeps namespaces apart (unset here = "local").
      - key: MEDX_STORE_PATH
        value: /tmp/medx/store.json
      # Add AMD_BASE_URL / AMD_API_KEY / AMD_MODEL in the Render dashboard when the AMD key arrives, then set MODEL_PROVIDER=amd.
